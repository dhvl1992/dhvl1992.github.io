<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dhvl1992</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#fafafa">
<meta name="color-scheme" content="only light">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/theme.css">
<style>
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s2)}
  a.app{display:block; background:var(--surface); border-radius:var(--r-card); padding:var(--s3) var(--s2) var(--s2);
        box-shadow:var(--shadow); text-decoration:none}
  a.app:active{transform:scale(.98)}
  .ico{width:52px; height:52px; display:block}
  .name{margin-top:var(--s2)}
  .desc{font-size:var(--fs-sm); color:var(--muted); margin-top:2px}
  .wrap{padding-top:var(--s3)}
  .sec-head{margin:0 0 var(--s2)}
  .sec-head h2{font-size:var(--fs-lg); font-weight:500; margin:0; letter-spacing:-.01em}

  /* ---------- Today (MyBrain tasks) ---------- */
  .today{margin-top:var(--s4)}
  .today-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:var(--s1)}
  .today-head h2{font-size:var(--fs-lg); font-weight:500; margin:0; letter-spacing:-.01em}
  .today-head .sub{margin:0}
  .today-list{background:var(--surface); border-radius:var(--r-card); box-shadow:var(--shadow); padding:var(--s1); max-height:340px; overflow-y:auto}
  .trow{display:flex; align-items:center; gap:12px; padding:12px var(--s2); border-radius:var(--r-ctl); text-decoration:none; color:var(--ink)}
  a.trow:hover{background:var(--soft)}
  .trow .dot{width:10px; height:10px; border-radius:50%; flex:none; background:var(--soft); box-shadow:inset 0 0 0 2px var(--muted)}
  .trow .dot.p1{background:var(--ink); box-shadow:none}
  .trow .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .trow .d{font-size:var(--fs-sm); color:var(--muted); flex:none}
  .trow .d.late{color:var(--warn)}
  .tgroup{font-size:var(--fs-sm); color:var(--muted); padding:var(--s1) var(--s2) 4px}
  .tmsg{padding:var(--s2); color:var(--muted); font-size:15px}
  .tmsg a{color:var(--accent); text-decoration:none}
  .skel-row{height:48px; background:var(--soft); opacity:.6}

  /* ---------- Curiosity Feed ---------- */
  .feed-head{display:flex; align-items:baseline; justify-content:space-between; margin:var(--s5) 0 var(--s1)}
  .feed-head h2{font-size:var(--fs-lg); font-weight:500; margin:0; letter-spacing:-.01em}
  /* Reels-style window: fixed height, one story per screen, snaps into place */
  .feed-box{position:relative}
  #feed{height:min(700px, calc(100dvh - 150px)); overflow-y:auto; scroll-snap-type:y mandatory; overscroll-behavior:contain;
        scrollbar-width:none; border-radius:var(--r-card)}
  #feed::-webkit-scrollbar{display:none}
  .slide{height:100%; scroll-snap-align:start; scroll-snap-stop:always; padding-bottom:var(--s2)}
  .story{height:100%; display:flex; flex-direction:column; overflow-y:auto; overscroll-behavior:auto; scrollbar-width:none;
         background:var(--surface); border-radius:var(--r-card); padding:var(--s3); box-shadow:var(--shadow)}
  .story .src{align-self:flex-start; margin-bottom:var(--s2)}
  /* Text size is set per card by fitText(): short stories get bigger text to fill the window */
  .story{--fit:1}
  .story h3{font-size:calc(20px * var(--fit))}
  .story p, .story .aha{font-size:calc(17px * var(--fit))}
  .next{margin-top:auto; display:flex; align-items:center; gap:var(--s1); width:100%; border:0; background:var(--soft); border-radius:var(--r-ctl);
        padding:12px var(--s2); cursor:pointer; text-align:left; font-size:var(--fs-sm); color:var(--muted)}
  .next b{font-weight:400; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .next.done{cursor:default; justify-content:center}
  .story.tight .next{display:none}
  .rabbit .next{background:var(--surface)}
  .when{font-size:var(--fs-sm); color:var(--muted)}
  .feed-nav .refresh{width:auto; height:40px; border:0; border-radius:var(--r-pill); background:var(--soft); color:var(--text); font:inherit; font-size:var(--fs-sm); padding:6px 12px; cursor:pointer; white-space:nowrap}
  .feed-nav .refresh:disabled{opacity:.5; cursor:default}
  .refresh-msg{margin:0 0 var(--s1); font-size:var(--fs-sm)}
  .refresh-msg.hidden{display:none}
  .feed-nav{display:flex; align-items:center; justify-content:flex-end; gap:var(--s1); margin:0 0 var(--s1)}
  .feed-nav .count{font-size:var(--fs-sm); color:var(--muted); margin-right:auto}
  .feed-nav button{width:40px; height:40px; border:0; border-radius:var(--r-pill); background:var(--soft); cursor:pointer; font-size:18px; line-height:1}
  .feed-nav button:disabled{opacity:.35; cursor:default}
  .story::-webkit-scrollbar{display:none}
  /* Wide screens: apps left, feed right; the page fits the screen and only the feed scrolls */
  @media (min-width: 1000px){
    .wrap{max-width:1180px; height:calc(100dvh - var(--topbar-h, 64px)); padding-bottom:var(--s3); display:flex; flex-direction:column}
    .layout{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:var(--s5)}
    .col-feed{display:flex; flex-direction:column; min-height:0}
    .col-apps{display:flex; flex-direction:column; min-height:0}
    .today{flex:1; min-height:0; display:flex; flex-direction:column}
    .today-list{max-height:none; flex:0 1 auto; min-height:0}
    .col-feed .feed-head{margin-top:0}
    .feed-box{flex:1; min-height:0}
    #feed{height:100%}
  }
  /* Phones: almost full screen like Reels, slightly tighter text so a story fits one screen */
  @media (max-width: 600px){
    #feed{height:calc(100dvh - 72px); max-height:780px} /* the shared bar hides while you scroll the feed */
    .story{padding:20px}
    .story h3{font-size:calc(18px * var(--fit)); margin:12px 0 6px}
    .story p{font-size:calc(16px * var(--fit)); line-height:1.45; margin-bottom:8px}
    .aha{margin-top:12px; padding:12px var(--s2); font-size:calc(16px * var(--fit)); line-height:1.45}
    .next{padding:10px 14px}
  }
  .story-top{display:flex; align-items:center; gap:var(--s1); font-size:var(--fs-sm); color:var(--muted)}
  .topic{display:inline-flex; align-items:center; gap:6px; background:var(--soft); color:var(--ink); border-radius:var(--r-pill); padding:4px 12px}
  .topic .em{font-size:16px; line-height:1}
  .new{background:var(--accent); color:var(--on-accent); border-radius:var(--r-pill); padding:2px 10px; font-size:12px}
  .read{margin-left:auto; text-align:right}
  .story h3{font-weight:500; line-height:1.3; margin:var(--s2) 0 var(--s1); letter-spacing:-.01em}
  .story p{margin:0 0 10px} .story p:last-of-type{margin-bottom:0}
  .aha{margin-top:var(--s2); background:var(--soft); border-radius:var(--r-ctl); padding:var(--s2)}
  .aha b{display:block; font-weight:500; font-size:var(--fs-sm); margin-bottom:4px}
  .src{display:inline-flex; align-items:center; gap:4px; margin-top:var(--s2); font-size:var(--fs-sm); color:var(--muted); text-decoration:none}
  .src:hover{color:var(--ink)}
  .rabbit{background:var(--soft); box-shadow:none}
  .rabbit .topic{background:var(--surface)}
  .dig{display:flex; flex-direction:column; gap:var(--s1); margin-top:var(--s2)}
  .dig a{display:flex; justify-content:space-between; gap:var(--s1); background:var(--surface); border-radius:var(--r-ctl); padding:12px var(--s2);
         text-decoration:none; font-size:15px}
  .dig a span{color:var(--muted)}
  .skel{height:100%; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow); opacity:.6}
</style>
</head>
<body>
<div class="wrap">

 <div class="layout">
 <section class="col-apps">
  <div class="sec-head"><h2>Apps</h2></div>
  <div class="grid" id="grid"></div>

  <!-- Today: due-today + overdue tasks from MyBrain (uses your MyBrain login on this same site) -->
  <div class="today">
    <div class="today-head"><h2>Today</h2><span class="sub" id="todayCount"></span></div>
    <div id="todayList" class="today-list"><div class="trow skel-row"></div></div>
  </div>
 </section>

 <section class="col-feed">
  <!-- Curiosity Feed: built 4× a day by .github/workflows/feed.yml into /feed/feed.json -->
  <div class="feed-head"><h2>Curiosity Feed</h2><span class="sub" id="feedWhen" style="margin:0"></span></div>
  <p class="sub">Five fresh stories at a time. Tap ↻ for more. Tap a source to read the full article.</p>
  <p class="note refresh-msg hidden" id="refreshMsg"></p>
  <div class="feed-nav"><span class="count" id="feedCount"></span><button id="feedRefresh" class="refresh" disabled>↻</button>
    <button id="feedUp" aria-label="Previous story">↑</button><button id="feedDown" aria-label="Next story">↓</button></div>
  <div class="feed-box"><div id="feed"><div class="slide"><div class="skel"></div></div></div></div>
 </section>
 </div>
</div>

<script src="/apps.js"></script>
<script>
// App list + icons come from /apps.js (shared with the top bar)
document.getElementById("grid").innerHTML = HUB.apps.map(a => `
  <a class="app" href="${a.url}">
    ${HUB.tile(a.icon)}
    <div class="name">${a.name}</div>
    <div class="desc">${a.desc}</div>
  </a>`).join("");

// ---- Today: due + overdue tasks from MyBrain ----
// Same website as MyBrain (dhvl1992.github.io), so the MyBrain login saved in this browser works here too.
// The publishable key is public by design; MyBrain's database rules only return YOUR rows when logged in.
const MB_URL = "https://yncbwqhytcxkqrlonkkk.supabase.co";
const MB_KEY = "sb_publishable_Sf-aeTSLVtF1aR2-KUSWMA_ecVQidxd";
const localIso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
let mbClient = null;
async function getMB() {
  if (mbClient) return mbClient;
  if (!window.supabase) await loadScript("/mybrain/vendor/supabase.js"); // MyBrain's own copy, no outside CDN
  return (mbClient = supabase.createClient(MB_URL, MB_KEY, { auth: { autoRefreshToken: false } })); // MyBrain keeps the login fresh
}
async function loadToday() {
  const box = document.getElementById("todayList"), count = document.getElementById("todayCount");
  try {
    const db = await getMB();
    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      box.innerHTML = `<div class="tmsg"><a href="/mybrain/">Log in to MyBrain</a> to see today's tasks here.</div>`;
      return;
    }
    const today = localIso();
    const { data, error } = await db.from("items").select("id, title, due, priority")
      .eq("kind", "todo").eq("done", false).lte("due", today).order("due").order("priority");
    if (error) throw error;
    const late = data.filter(t => t.due < today), now = data.filter(t => t.due === today);
    count.textContent = data.length ? `${data.length} to do` : "";
    if (!data.length) { box.innerHTML = `<div class="tmsg">Nothing due today ✓</div>`; return; }
    const daysLate = d => Math.round((new Date(today) - new Date(d)) / 86400000);
    const row = (t, label, cls) => `<a class="trow" href="/mybrain/#todo/${encodeURIComponent(t.id)}">
        <span class="dot ${t.priority === 1 ? "p1" : ""}"></span><span class="t">${esc(t.title)}</span><span class="d ${cls}">${label}</span></a>`;
    box.innerHTML =
      (late.length ? `<div class="tgroup">Overdue</div>` + late.map(t => row(t, daysLate(t.due) === 1 ? "1 day late" : `${daysLate(t.due)} days late`, "late")).join("") : "")
      + (now.length ? `<div class="tgroup">Today</div>` + now.map(t => row(t, "Today", "")).join("") : "");
  } catch (e) {
    box.innerHTML = `<div class="tmsg">Couldn't load tasks right now. <a href="/mybrain/">Open MyBrain ›</a></div>`;
  }
}

// Logo tapped on the home page → also scroll the feed back to its first story
document.addEventListener("topbar:home", () => document.getElementById("feed")?.scrollTo({ top: 0, behavior: "smooth" }));

// ---- Curiosity Feed ----
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https:\/\//.test(u) ? u : "#"; // only real https links
const time = d => d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
function runLabel(iso) {
  const d = new Date(iso), today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
  const day = d.toDateString() === today.toDateString() ? "Today" : d.toDateString() === y.toDateString() ? "Yesterday"
    : d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" });
  return `${day} · ${time(d)}`;
}
// Split a story into short paragraphs (2–3 sentences each) so it reads easily on a phone
function paras(text) {
  const sent = String(text || "").match(/[^.!?]+[.!?]+["”’)]*\s*|[^.!?]+$/g) || [String(text || "")];
  const n = sent.length <= 4 ? 2 : 3, out = [];
  for (let i = 0; i < sent.length; i += n) out.push(sent.slice(i, i + n).join("").trim());
  return out.map(p => `<p>${esc(p)}</p>`).join("");
}
// Bottom of each card: preview of the next one (fills spare space, invites the next flick)
const nextHtml = n => n
  ? `<button class="next" data-next>Up next<b>${esc(n.emoji)} ${esc(n.title)}</b>↓</button>`
  : `<div class="next done">You're all caught up ✓</div>`;
const storyHtml = (s, isNew, when, next) => `
  <div class="slide"><article class="story">
    <div class="story-top"><span class="topic"><span class="em">${esc(s.emoji)}</span>${esc(s.topic)}</span>
      ${isNew ? '<span class="new">New</span>' : ""}<span class="read">${esc(when)}<br>~${esc(s.readSec)} sec read</span></div>
    <h3>${esc(s.headline)}</h3>
    ${paras(s.body)}
    <div class="aha"><b>💡 Aha!</b>${esc(s.aha)}</div>
    <a class="src" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">Read at ${esc(s.source)} ›</a>
    ${nextHtml(next)}
  </article></div>`;
const rabbitHtml = (r, when, next) => `
  <div class="slide"><article class="story rabbit">
    <div class="story-top"><span class="topic"><span class="em">🕳️</span>Rabbit hole · ${esc(r.topic)}</span><span class="read">${esc(when)}</span></div>
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.body)}</p>
    <div class="dig">${(r.dig || []).map(d => `<a href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener">${esc(d.q)}<span>›</span></a>`).join("")}</div>
    <a class="src" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">Starts from ${esc(r.source)} ›</a>
    ${nextHtml(next)}
  </article></div>`;

async function loadFeed() {
  const box = document.getElementById("feed");
  let lastVisit = 0;
  try { lastVisit = Number(localStorage.getItem("feedLastVisit")) || 0; } catch {}
  try {
    const res = await fetch("/feed/feed.json", { cache: "no-cache" }); // always check for the newest feed
    if (!res.ok) throw new Error(res.status);
    const feed = await res.json();
    const runs = (feed.runs || []).filter(r => r.stories?.length);
    if (!runs.length) throw new Error("empty");
    document.getElementById("feedWhen").textContent = "Updated " + time(new Date(feed.updated));
    feedUpdated = Date.parse(feed.updated) || 0; refreshButton();
    // Flatten to one list of cards, so each card knows the next one
    const cards = [];
    runs.forEach(r => {
      const isNew = lastVisit && Date.parse(r.at) > lastVisit, when = runLabel(r.at);
      r.stories.forEach(s => cards.push({ kind: "story", d: s, isNew, when, title: s.headline, emoji: s.emoji }));
      if (r.rabbit) cards.push({ kind: "rabbit", d: r.rabbit, when, title: r.rabbit.title, emoji: "🕳️" });
    });
    box.innerHTML = cards.map((c, i) => c.kind === "story"
      ? storyHtml(c.d, c.isNew, c.when, cards[i + 1]) : rabbitHtml(c.d, c.when, cards[i + 1])).join("");
    box.scrollTop = 0;
    fitText();
    updateCount();
    try { localStorage.setItem("feedLastVisit", String(Date.now())); } catch {}
  } catch (e) {
    box.innerHTML = `<p class="note">Couldn't load the feed right now. Try again in a minute.</p>`;
    document.querySelector(".feed-nav").style.display = "none";
  }
}

// Biggest text (up to 140%) that still fits each card, so short stories don't leave empty space
function fitText() {
  for (const card of document.querySelectorAll("#feed .story")) {
    let f = 1.4;
    card.style.setProperty("--fit", f);
    card.classList.remove("tight");
    while (f > 1 && card.scrollHeight > card.clientHeight + 1) { f = Math.round((f - 0.05) * 100) / 100; card.style.setProperty("--fit", f); }
    if (card.scrollHeight > card.clientHeight + 1) card.classList.add("tight"); // long story: no room for "Up next"
  }
}
let fitTimer;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitText, 150); });

// "3 / 21" counter + ↑ ↓ buttons (one story per step)
const feedBox = document.getElementById("feed");
function current() { return Math.round(feedBox.scrollTop / feedBox.clientHeight); }
function updateCount() {
  const n = feedBox.querySelectorAll(".slide").length, i = current();
  document.getElementById("feedCount").textContent = n ? `${i + 1} / ${n}` : "";
  document.getElementById("feedUp").disabled = i <= 0;
  document.getElementById("feedDown").disabled = i >= n - 1;
}
feedBox.addEventListener("scroll", () => requestAnimationFrame(updateCount), { passive: true });
feedBox.addEventListener("click", e => { if (e.target.closest("[data-next]")) document.getElementById("feedDown").click(); });
document.getElementById("feedUp").onclick = () => feedBox.scrollBy({ top: -feedBox.clientHeight, behavior: "smooth" });
document.getElementById("feedDown").onclick = () => feedBox.scrollBy({ top: feedBox.clientHeight, behavior: "smooth" });
// Keyboard ↑ ↓ (desktop) move one story
document.addEventListener("keydown", e => {
  if (!["ArrowDown", "ArrowUp"].includes(e.key) || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  e.preventDefault();
  document.getElementById(e.key === "ArrowDown" ? "feedDown" : "feedUp").click();
});
// ---------- ↻ Refresh button ----------
// GitHub's own timer is unreliable, so the button asks GitHub to run the feed job (.github/workflows/feed.yml).
// Unlocks 4 h after the last update. The job checks the same lock, so double taps cost nothing.
// Needs a GitHub key (fine-grained token, Actions: read & write, this repo only), saved in this browser only.
const LOCK_MS = 4 * 3600e3, WAIT_MS = 8 * 60e3, KEY = "key_github_feed", ASKED = "feedRefreshAt";
const WORKFLOW = "https://api.github.com/repos/dhvl1992/dhvl1992.github.io/actions/workflows/feed.yml/dispatches";
let feedUpdated = 0, pollTimer = null;
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
             set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
function refreshMsg(text) {
  const el = document.getElementById("refreshMsg");
  el.textContent = text || ""; el.classList.toggle("hidden", !text);
}
function refreshButton() {
  const btn = document.getElementById("feedRefresh");
  const asked = Number(ls.get(ASKED)) || 0, now = Date.now();
  if (asked && asked > feedUpdated && now - asked < WAIT_MS) { // waiting for GitHub
    btn.disabled = true; btn.textContent = "↻ Getting stories…";
    refreshMsg("Fresh stories are on the way, about 4 minutes. You can keep reading.");
    if (!pollTimer) pollTimer = setInterval(checkNew, 20000);
    return;
  }
  if (asked && asked > feedUpdated) { // waited long enough, nothing new arrived
    ls.set(ASKED, null);
    refreshMsg("No new stories this time (the news sites had nothing fresh). Try again later.");
  }
  clearInterval(pollTimer); pollTimer = null;
  const openAt = feedUpdated + LOCK_MS;
  btn.disabled = now < openAt;
  btn.textContent = btn.disabled ? "↻ " + time(new Date(openAt)) : "↻ Refresh";
  btn.title = btn.disabled ? "New stories can be fetched from " + time(new Date(openAt)) : "Get 5 fresh stories";
}
async function checkNew() {
  const before = feedUpdated;
  await loadFeed();
  if (feedUpdated > before) { ls.set(ASKED, null); refreshMsg(""); }
  refreshButton();
}
document.getElementById("feedRefresh").addEventListener("click", async () => {
  let key = ls.get(KEY);
  if (!key) {
    key = (prompt("Paste your GitHub key (starts with github_pat_). It stays only in this browser.") || "").trim();
    if (!key) return;
  }
  const btn = document.getElementById("feedRefresh");
  btn.disabled = true; btn.textContent = "↻ Asking GitHub…";
  try {
    const res = await fetch(WORKFLOW, { method: "POST",
      headers: { Authorization: "Bearer " + key, Accept: "application/vnd.github+json" },
      body: JSON.stringify({ ref: "main" }) });
    if (res.status === 204) { ls.set(KEY, key); ls.set(ASKED, String(Date.now())); refreshButton(); return; }
    if (res.status === 401) { ls.set(KEY, null); refreshMsg("GitHub didn't accept the key (wrong, expired or deleted). Tap ↻ to paste a new one."); }
    else if (res.status === 403 || res.status === 404) { ls.set(KEY, null); refreshMsg("This key isn't allowed to start the feed. Make one with Actions: Read and write on dhvl1992.github.io."); }
    else refreshMsg("GitHub said no (" + res.status + "). Try again in a few minutes.");
  } catch { refreshMsg("Couldn't reach GitHub. Check your internet and try again."); }
  refreshButton();
});
setInterval(refreshButton, 60000); // unlocks by itself when the 4 hours are up
loadFeed();
loadToday();

// Service worker: needed so Chrome offers "Install"
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
// One-time clean-up: the August ReelScribe left a service worker at /Reelscribe/ that serves an old saved copy forever.
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => {
  if (/\/reelscribe\/$/i.test(new URL(r.scope).pathname)) r.unregister();
}));
if (window.caches) caches.delete("reel-scribe-shell-v1");

</script>
<script src="/topbar.js"></script>
</body>
</html>
