<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Apps</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f6f5c">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root{ --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e4e2db; --accent:#1f6f5c; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151514; --card:#1f1f1d; --ink:#ecebe6; --muted:#a09f99; --line:#33322f; --accent:#5cbf9f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:20px 14px 40px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  a.app{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;color:inherit;text-decoration:none}
  a.app:active{transform:scale(.98)}
  .emoji{font-size:34px;line-height:1}
  .name{font-weight:700;margin-top:10px}
  .desc{font-size:12px;color:var(--muted);margin-top:2px}
  #install{display:none;width:100%;margin-top:18px;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>My Apps</h1>
  <p class="sub">Tap an app to open it.</p>
  <div class="grid" id="grid"></div>
  <button id="install">Install as app</button>
</div>

<script>
// ---- Single source of truth: add a new app = add one line here ----
const APPS = [
  { name: "MyBrain",        desc: "To-do + notes",        emoji: "🧠", url: "/mybrain/" },
  { name: "SIP Calculator", desc: "Monthly ETF splitter", emoji: "📈", url: "/sipcalc/" },
];

document.getElementById("grid").innerHTML = APPS.map(a => `
  <a class="app" href="${a.url}">
    <div class="emoji">${a.emoji}</div>
    <div class="name">${a.name}</div>
    <div class="desc">${a.desc}</div>
  </a>`).join("");

// Service worker: needed so Chrome offers "Install"
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");

// Show our own Install button when Chrome allows it
let promptEvent = null;
const btn = document.getElementById("install");
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptEvent = e; btn.style.display = "block"; });
btn.addEventListener("click", async () => {
  if (!promptEvent) return;
  promptEvent.prompt();
  await promptEvent.userChoice;
  promptEvent = null; btn.style.display = "none";
});
</script>
</body>
</html>
