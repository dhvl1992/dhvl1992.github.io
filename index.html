<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Apps</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#fafafa">
<meta name="color-scheme" content="only light">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/theme.css">
<style>
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s2)}
  a.app{display:block; background:var(--surface); border-radius:var(--r-card); padding:var(--s3) var(--s2) var(--s2);
        box-shadow:var(--shadow); text-decoration:none}
  a.app:active{transform:scale(.98)}
  .ico{width:52px; height:52px; display:block}
  .name{margin-top:var(--s2)}
  .desc{font-size:var(--fs-sm); color:var(--muted); margin-top:2px}
  #install{display:none; width:100%; margin-top:var(--s3)}

  /* ---------- Curiosity Feed ---------- */
  .feed-head{display:flex; align-items:baseline; justify-content:space-between; margin:var(--s5) 0 var(--s1)}
  .feed-head h2{font-size:var(--fs-lg); font-weight:500; margin:0; letter-spacing:-.01em}
  .run-label{font-size:var(--fs-sm); color:var(--muted); margin:var(--s4) 0 var(--s2) var(--s1)}
  .story{background:var(--surface); border-radius:var(--r-card); padding:var(--s3); margin-bottom:var(--s2); box-shadow:var(--shadow)}
  .story-top{display:flex; align-items:center; gap:var(--s1); font-size:var(--fs-sm); color:var(--muted)}
  .topic{display:inline-flex; align-items:center; gap:6px; background:var(--soft); color:var(--ink); border-radius:var(--r-pill); padding:4px 12px}
  .topic .em{font-size:16px; line-height:1}
  .new{background:var(--accent); color:var(--on-accent); border-radius:var(--r-pill); padding:2px 10px; font-size:12px}
  .read{margin-left:auto}
  .story h3{font-size:20px; font-weight:500; line-height:1.3; margin:var(--s2) 0 var(--s1); letter-spacing:-.01em}
  .story p{margin:0 0 10px} .story p:last-of-type{margin-bottom:0}
  .aha{margin-top:var(--s2); background:var(--soft); border-radius:var(--r-ctl); padding:var(--s2)}
  .aha b{display:block; font-weight:500; font-size:var(--fs-sm); margin-bottom:4px}
  .src{display:inline-flex; align-items:center; gap:4px; margin-top:var(--s2); font-size:var(--fs-sm); color:var(--muted); text-decoration:none}
  .src:hover{color:var(--ink)}
  .rabbit{background:var(--soft); box-shadow:none}
  .rabbit .topic{background:var(--surface)}
  .dig{display:flex; flex-direction:column; gap:var(--s1); margin-top:var(--s2)}
  .dig a{display:flex; justify-content:space-between; gap:var(--s1); background:var(--surface); border-radius:var(--r-ctl); padding:12px var(--s2);
         text-decoration:none; font-size:15px}
  .dig a span{color:var(--muted)}
  .skel{height:220px; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow); margin-bottom:var(--s2); opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">My Apps</h1>
  <p class="sub">Tap an app to open it.</p>
  <div class="grid" id="grid"></div>
  <button class="btn btn-primary" id="install">Install as app</button>

  <!-- Curiosity Feed: built 4× a day by .github/workflows/feed.yml into /feed/feed.json -->
  <div class="feed-head"><h2>Curiosity Feed</h2><span class="sub" id="feedWhen" style="margin:0"></span></div>
  <p class="sub">Five fresh stories, four times a day. Tap a source to read the full article.</p>
  <div id="feed"><div class="skel"></div><div class="skel"></div></div>
</div>

<script>
// ---- Icons: soft grey tile, black shapes, one blue shape (see DESIGN.md) ----
const K = "var(--ink)", A = "var(--accent)";
const ICONS = {
  // checklist
  brain: `<rect x="14" y="15" width="8" height="8" rx="2" fill="${A}"/><rect x="26" y="17" width="24" height="4" rx="2" fill="${K}"/>
          <rect x="14" y="28" width="8" height="8" rx="2" fill="${A}"/><rect x="26" y="30" width="24" height="4" rx="2" fill="${K}"/>
          <rect x="14" y="41" width="8" height="8" rx="2" fill="${K}"/><rect x="26" y="43" width="16" height="4" rx="2" fill="${K}"/>`,
  // rising bars
  sip:   `<rect x="14" y="36" width="9" height="14" rx="2.5" fill="${K}"/><rect x="27.5" y="27" width="9" height="23" rx="2.5" fill="${K}"/>
          <rect x="41" y="16" width="9" height="34" rx="2.5" fill="${A}"/>`,
  // open book
  book:  `<path d="M12 19 Q22 15 31 19 V48 Q22 44 12 48 Z" fill="${K}"/><path d="M33 19 Q42 15 52 19 V48 Q42 44 33 48 Z" fill="${A}"/>`,
  // page → picture
  pdf:   `<rect x="12" y="11" width="24" height="31" rx="4" fill="${K}"/>
          <rect x="26" y="26" width="27" height="27" rx="5" fill="${A}" stroke="var(--soft)" stroke-width="3"/>
          <path d="M31 48 L38 39 L42 44 L45 41 L49 48 Z" fill="${K}"/>`,
};
const tile = k => `<svg class="ico" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="var(--soft)"/>${ICONS[k]}</svg>`;

// ---- Single source of truth: add a new app = add one line here ----
const APPS = [
  { name: "MyBrain",        desc: "To-do + notes",        icon: "brain", url: "/mybrain/" },
  { name: "SIP Calculator", desc: "Monthly ETF splitter", icon: "sip",   url: "/sipcalc/" },
  { name: "Quiet Reader",   desc: "Markdown book reader", icon: "book",  url: "/reader/" },
  { name: "PDF to JPG",     desc: "Pages to images",      icon: "pdf",   url: "/pdf2jpg/" },
];

document.getElementById("grid").innerHTML = APPS.map(a => `
  <a class="app" href="${a.url}">
    ${tile(a.icon)}
    <div class="name">${a.name}</div>
    <div class="desc">${a.desc}</div>
  </a>`).join("");

// ---- Curiosity Feed ----
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https:\/\//.test(u) ? u : "#"; // only real https links
const time = d => d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
function runLabel(iso) {
  const d = new Date(iso), today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
  const day = d.toDateString() === today.toDateString() ? "Today" : d.toDateString() === y.toDateString() ? "Yesterday"
    : d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" });
  return `${day} · ${time(d)}`;
}
// Split a story into short paragraphs (2–3 sentences each) so it reads easily on a phone
function paras(text) {
  const sent = String(text || "").match(/[^.!?]+[.!?]+["”’)]*\s*|[^.!?]+$/g) || [String(text || "")];
  const n = sent.length <= 4 ? 2 : 3, out = [];
  for (let i = 0; i < sent.length; i += n) out.push(sent.slice(i, i + n).join("").trim());
  return out.map(p => `<p>${esc(p)}</p>`).join("");
}
const storyHtml = (s, isNew) => `
  <article class="story">
    <div class="story-top"><span class="topic"><span class="em">${esc(s.emoji)}</span>${esc(s.topic)}</span>
      ${isNew ? '<span class="new">New</span>' : ""}<span class="read">~${esc(s.readSec)} sec read</span></div>
    <h3>${esc(s.headline)}</h3>
    ${paras(s.body)}
    <div class="aha"><b>💡 Aha!</b>${esc(s.aha)}</div>
    <a class="src" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">Read at ${esc(s.source)} ›</a>
  </article>`;
const rabbitHtml = r => `
  <article class="story rabbit">
    <div class="story-top"><span class="topic"><span class="em">🕳️</span>Rabbit hole · ${esc(r.topic)}</span></div>
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.body)}</p>
    <div class="dig">${(r.dig || []).map(d => `<a href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener">${esc(d.q)}<span>›</span></a>`).join("")}</div>
    <a class="src" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">Starts from ${esc(r.source)} ›</a>
  </article>`;

async function loadFeed() {
  const box = document.getElementById("feed");
  let lastVisit = 0;
  try { lastVisit = Number(localStorage.getItem("feedLastVisit")) || 0; } catch {}
  try {
    const res = await fetch("/feed/feed.json", { cache: "no-cache" }); // always check for the newest feed
    if (!res.ok) throw new Error(res.status);
    const feed = await res.json();
    const runs = (feed.runs || []).filter(r => r.stories?.length);
    if (!runs.length) throw new Error("empty");
    document.getElementById("feedWhen").textContent = "Updated " + time(new Date(feed.updated));
    box.innerHTML = runs.map(r => {
      const isNew = lastVisit && Date.parse(r.at) > lastVisit;
      return `<div class="run-label">${esc(runLabel(r.at))}</div>`
        + r.stories.map(s => storyHtml(s, isNew)).join("")
        + (r.rabbit ? rabbitHtml(r.rabbit) : "");
    }).join("");
    try { localStorage.setItem("feedLastVisit", String(Date.now())); } catch {}
  } catch (e) {
    box.innerHTML = `<p class="note">Couldn't load the feed right now. Try again in a minute.</p>`;
  }
}
loadFeed();

// Service worker: needed so Chrome offers "Install"
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");

// Show our own Install button when Chrome allows it
let promptEvent = null;
const btn = document.getElementById("install");
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptEvent = e; btn.style.display = "flex"; });
btn.addEventListener("click", async () => {
  if (!promptEvent) return;
  promptEvent.prompt();
  await promptEvent.userChoice;
  promptEvent = null; btn.style.display = "none";
});
</script>
</body>
</html>
